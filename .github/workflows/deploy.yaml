name: Deploy to Tomcat via Manager API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build WAR using Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        shell: powershell
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          $war = (Get-ChildItem target\*.war | Select-Object -First 1).FullName
          $app = "TEST"
          Write-Host "Deploying $war"

          $response = curl.exe -s -u "${env:TOMCAT_USER}:${env:TOMCAT_PASS}" `
            --upload-file "$war" `
            "http://${env:TOMCAT_HOST}:8080/manager/text/deploy?path=/$app&update=true"

          $text = $response -join "`n"
          Write-Host $text
          if (-not $text.StartsWith("OK")) { exit 1 }

      - name: Verify app is up
        shell: powershell
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          Start-Sleep -Seconds 10
          curl.exe -f -s -o NUL "http://${env:TOMCAT_HOST}:8080/TEST/"
          if ($LASTEXITCODE -ne 0) { exit 1 }