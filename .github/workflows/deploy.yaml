name: Deploy to Tomcat via Manager API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build WAR using Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        shell: powershell
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          $war = (Get-ChildItem target\*.war | Select-Object -First 1).FullName
          $app = "TEST"
          Write-Host "Deploying $war"
          Write-Host "Host length: $($env:TOMCAT_HOST.Length)"

          curl.exe -sS -m 120 -u "${env:TOMCAT_USER}:${env:TOMCAT_PASS}" `
            --upload-file "$war" `
            -o response.txt -w "HTTP status: %{http_code}`n" `
            "http://${env:TOMCAT_HOST}:8080/manager/text/deploy?path=/$app&update=true"
          $curlExit = $LASTEXITCODE
          Write-Host "curl exit code: $curlExit"

          if (Test-Path response.txt) { Get-Content response.txt }

          if ($curlExit -ne 0) { exit 1 }
          if (-not (Select-String -Path response.txt -Pattern "^OK" -Quiet)) { exit 1 }

      - name: Verify app is up
        shell: powershell
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          Start-Sleep -Seconds 10
          curl.exe -f -s -o NUL "http://${env:TOMCAT_HOST}:8080/TEST/"
          if ($LASTEXITCODE -ne 0) { exit 1 }