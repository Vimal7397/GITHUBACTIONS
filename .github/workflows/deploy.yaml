name: Deploy to Tomcat via Manager API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build WAR using Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        shell: bash
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          APP_NAME=TEST

          RESPONSE=$(curl -s -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/$APP_NAME&update=true")

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK" || exit 1

      - name: Verify app is up
        shell: bash
        run: |
          sleep 10
          curl -f -s -o /dev/null "http://${{ secrets.TOMCAT_HOST }}:8080/TEST/"
